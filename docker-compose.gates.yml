# Ambiente efêmero dos gates: banco próprio em tmpfs, nenhuma porta publicada no host.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catraca
      POSTGRES_PASSWORD: catraca
      POSTGRES_DB: catraca_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catraca -d catraca_test"]
      interval: 1s
      timeout: 3s
      retries: 60

  gates:
    build:
      context: .
      target: gates
    environment:
      DATABASE_URL: postgres://catraca:catraca@db:5432/catraca_test
      PARTNER_API_KEY: chave-de-teste
      # Só nos testes: atrasos do gateway encolhidos 100x (2–5 s viram 20–50 ms).
      GATEWAY_DELAY_SCALE: "0.01"
    depends_on:
      db:
        condition: service_healthy
